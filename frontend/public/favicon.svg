<!--
  The aperture: a rounded square opening onto an iris ring, with the counter
  reading as the E of ExamForge. It survives 16px because the ring is one
  weight and the counter is a single gap.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ExamForge">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A70FF"/>
      <stop offset="1" stop-color="#4A3FE0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <path d="M22 10.4H13.6v3.9H20v3.4h-6.4v3.9H22" fill="none" stroke="#fff" stroke-width="3.1"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
